services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salary_management
      POSTGRES_USER: salary_management
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary_management -d salary_management"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://salary_management:local-development-only@postgres:5432/salary_management
      jwt_secret: local-docker-secret-change-me
      jwt_algorithm: HS256
      jwt_expiry_minutes: 90
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"

  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["test"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://salary_management:local-development-only@postgres:5432/salary_management
      DATABASE_URL: postgresql+psycopg://salary_management:local-development-only@postgres:5432/salary_management
      jwt_secret: local-docker-secret-change-me
    command: ["pytest", "-v"]

volumes:
  postgres_data:
